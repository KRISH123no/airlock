[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlock"
version = "0.1.0"
description = "A gateway for LLM traffic: retries, provider fallback, circuit breaking, budgets, caching, guardrails and a trace for every request."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krish Saxena" }]
keywords = ["llm", "gateway", "reliability", "observability", "cost-control", "guardrails", "ai-infrastructure"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.32"]

[project.scripts]
airlock = "airlock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
